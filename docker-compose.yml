services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - path: /opt/kalshibot/kalshi_btc_bot/.env
        required: true
    volumes:
      # Persist DB and logs across container restarts/deploys
      - ./data:/app/data
      - ./logs:/app/logs
      # Mount private key — path must match KALSHI_KEY_PATH in .env
      - /opt/kalshibot/kalshi_btc_bot/keys/kalshi.pem:/opt/kalshibot/kalshi_btc_bot/keys/kalshi.pem:ro
    environment:
      - KALSHI_KEY_PATH=/opt/kalshibot/kalshi_btc_bot/keys/kalshi.pem
    command: >
      python -m src.main --live --config config/b97_micro_live.yaml
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('data/trades.db').execute('SELECT 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
