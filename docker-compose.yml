services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persist DB and logs across container restarts/deploys
      - ./data:/app/data
      - ./logs:/app/logs
      # Mount private key from host path set in .env (KALSHI_KEY_PATH)
      - ${KALSHI_KEY_PATH}:${KALSHI_KEY_PATH}:ro
    command: >
      python -m src.main --live --config config/b97_micro_live.yaml
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('data/trades.db').execute('SELECT 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
