[project]
name = "kalshi-btc-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kalshi-python>=2.0.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "structlog>=24.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest-cov>=4.1.0", "ruff>=0.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
